<!DOCTYPE HTML>
<html>

<head>
    <title>Mall of Bazaar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <noscript>
        <link rel="stylesheet" href="assets/css/noscript.css" />
    </noscript>
    <style>
        /* Ek Stil Düzenlemeleri (Gerekirse) */
        #header {
            text-align: center;
            color: #fff;
            position: relative;
            z-index: 4;
            margin-bottom: 2em;
        }

        #header h1 {
            font-size: 2.5em;
            margin: 0 0 0.1em 0;
            padding: 0;
        }

        #header p {
            font-size: 1.1em;
            margin: 0 0 1.5em 0;
            padding: 0;
            opacity: 0.75;
        }

        #header .address {
            font-size: 1em;
            margin: 0.5em 0 1em 0;
            padding: 0;
            opacity: 0.75;
        }

        #nav {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #nav ul {
            list-style: none;
            padding: 0;
            margin: 0 0 1em 0;
            display: flex;
            justify-content: center;
        }

        #nav ul li {
            display: inline-block;
            margin: 0 0.5em;
            padding: 0;
        }

        #nav ul li a {
            position: relative;
            display: block;
            width: 3em;
            height: 3em;
            line-height: 3em;
            border: solid 1px rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            opacity: 0.75;
            transition: opacity 0.3s ease;
        }

        #nav ul li a:hover {
            opacity: 1;
        }

        .icon {
            text-decoration: none;
            border-bottom: none;
            position: relative;
        }

        .icon:before {
            font-family: FontAwesome;
            font-style: normal;
            font-weight: normal;
            text-decoration: none;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .icon > .label {
            display: none;
        }

        .icon.brands.fa-instagram:before {
            content: "\f16d";
        }

        .icon.brands.fa-telegram:before {
            content: "\f2c6";
        }

        .stok-bilgisi-button {
            display: inline-block;
            padding: 0.7em 1.5em;
            font-size: 1em;
            text-align: center;
            text-decoration: none;
            color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 0.5em;
            transition: background-color 0.3s ease, border-color 0.3s ease;
            white-space: nowrap;
        }

        .stok-bilgisi-button:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="is-preload">
    <video autoplay loop muted playsinline class="bg-video">
        <source src="video.mp4" type="video/mp4">
        Tarayıcınız video etiketini desteklemiyor.
    </video>
    <div id="wrapper">
        <div id="bg"></div>
        <div id="overlay"></div>
        <div id="main">

            <header id="header">
                <h1>Mall Of Bazaar</h1>
                <p class="address">
                    Mimarkemalettin mah. Azimkar sok. No:33 İstanbul, Aksaray
                    34080
                </p>
                <nav id="nav">
                    <ul>
                        <li><a href="https://www.instagram.com/mall_of_bazaar/" class="icon brands fa-instagram"
                                target="_blank"><span class="label">Instagram</span></a></li>
                        <li><a href="https://t.me/MallOfBazaarStore" class="icon brands fa-telegram"
                                target="_blank"><span class="label">Telegram</span></a></li>
                    </ul>
                    <a href="https://bazaarstok.com" class="stok-bilgisi-button" target="_blank">Stok Bilgisi</a>
                </nav>
            </header>

            <footer id="footer">
                <span class="copyright">&copy; Untitled. Design:
                    <a href="https://texper.net">texper.net</a>.</span>
            </footer>

        </div>
    </div>
    <script>
        window.onload = function () {
            document.body.classList.remove('is-preload');
        }
        window.ontouchmove = function () {
            return false;
        }
        window.onorientationchange = function () {
            document.body.scrollTop = 0;
        }
    </script>
</body>

</html>
